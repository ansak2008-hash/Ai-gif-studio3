[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gif-studio"
version = "0.3.0"
description = "Production-oriented extensible Telegram video-to-GIF studio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiogram>=3.13,<4",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "arq>=0.26,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10,<12",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "hypothesis>=6.80,<7",
]
[project.scripts]
ai-gif-studio = "ai_gif_studio.main:main"
ai-gif-studio-api = "ai_gif_studio.interfaces.api:main"
[tool.hatch.build.targets.wheel]
packages = ["src/ai_gif_studio"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires FFmpeg/FFprobe and exercises the real media pipeline",
  "unit: pure logic with no external media pipeline",
  "slow: takes more than 5 seconds",
  "determinism: verifies bit-identical output across runs",
  "golden: compares against committed golden frames",
]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "B904", "B905"]
