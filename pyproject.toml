[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gif-studio"
version = "0.2.0"
description = "Production-oriented extensible Telegram video-to-GIF studio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiogram>=3.13,<4",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "arq>=0.26,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9","pytest-asyncio>=0.24,<1","ruff>=0.7,<1"]
[project.scripts]
ai-gif-studio = "ai_gif_studio.main:main"
[tool.hatch.build.targets.wheel]
packages = ["src/ai_gif_studio"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["F","B"]
ignore = ["B904","B905"]
