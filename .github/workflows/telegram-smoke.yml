name: Telegram Smoke Test

on:
  workflow_dispatch:

jobs:
  telegram-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Start Arq worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          APP_DATABASE_URL: sqlite+aiosqlite:///./data/ai_gif_studio.db
          APP_REDIS_URL: redis://127.0.0.1:6379/0
          APP_AUTO_CREATE_SCHEMA: "true"
        run: |
          mkdir -p data
          nohup arq ai_gif_studio.infrastructure.worker.WorkerSettings > worker.log 2>&1 &
          sleep 5
          pgrep -af "arq" || (cat worker.log && exit 1)

      - name: Start Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          APP_DATABASE_URL: sqlite+aiosqlite:///./data/ai_gif_studio.db
          APP_REDIS_URL: redis://127.0.0.1:6379/0
          APP_AUTO_CREATE_SCHEMA: "true"
          APP_TEMP_DIRECTORY: ./data/tmp
          APP_STORAGE_DIRECTORY: ./data/artifacts
          APP_MAX_QUEUE_DEPTH: "100"
        run: |
          echo "Telegram smoke test is live for 8 minutes."
          timeout --signal=TERM 480s ai-gif-studio
          status=$?
          if [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            echo "Bot exited unexpectedly with status $status"
            cat worker.log || true
            exit "$status"
          fi

      - name: Show worker log
        if: always()
        run: cat worker.log || true
