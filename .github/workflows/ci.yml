name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -m "unit and not integration and not slow"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify FFmpeg drawtext shaping support
        run: ffmpeg -hide_banner -h filter=drawtext 2>&1 | grep -q "text_shaping"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "integration and not slow"

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/load_test.py -m slow
