name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Keep numerical/rendering behavior stable across runners.
# Verification trigger: runtime evidence is required before Phase 2 closeout.
env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip pip-audit 'setuptools>=83'
      - run: pip install -e .
      - run: pip-audit

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -c "import cv2, numpy; print('numpy', numpy.__version__); print('opencv', cv2.__version__)"
      - run: ruff check .
      - name: Check formatting of newly added Python files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA=""
          fi

          files=""
          if [[ -n "$BASE_SHA" ]] &&
             [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
            files="$(git diff --name-status "$BASE_SHA" "${{ github.sha }}" -- '*.py' |
              awk '$1 == "A" {print $2}')"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            files="$(git diff-tree --root --no-commit-id --name-status -r "${{ github.sha }}" -- '*.py' |
              awk '$1 == "A" {print $2}')"
          else
            echo "No valid comparison base; no newly added Python files to format-check."
          fi

          if [[ -n "$files" ]]; then
            echo "Checking formatting for added files:"
            printf '%s\n' "$files"
            printf '%s\n' "$files" | xargs ruff format --check
          else
            echo "No newly added Python files to check."
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: python -m pip check
      - name: Import temporal engine
        run: |
          python -c "import ai_gif_studio.temporal_engine; print('temporal_engine import: OK')"
      - name: Collect unit tests
        run: pytest --collect-only -m "unit and not integration and not slow" -q
      - name: Unit tests
        run: pytest -q -m "unit and not integration and not slow" --tb=short

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -c "import cv2, numpy; print('numpy', numpy.__version__); print('opencv', cv2.__version__)"
      - name: Render twice, compare
        run: pytest -q tests/test_determinism.py --tb=short

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify FFmpeg drawtext shaping support
        run: ffmpeg -hide_banner -h filter=drawtext 2>&1 | grep -q "text_shaping"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "integration and not slow"

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/load_test.py -m slow
