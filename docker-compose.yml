services:
  telegram:
    build: .
    command: ["ai-gif-studio"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/data/artifacts
      - tmp:/app/data/tmp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build: .
    command: ["arq", "ai_gif_studio.infrastructure.worker.WorkerSettings"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/data/artifacts
      - tmp:/app/data/tmp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_gif_studio
      POSTGRES_USER: ai_gif_studio
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_gif_studio -d ai_gif_studio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  artifacts:
  tmp:
  redis:
  postgres:
